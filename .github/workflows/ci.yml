name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project with development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Build distribution
        run: python -m build

      - name: Verify wheel in a clean virtual environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/spotify-cluster
